<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#E8D8C4">
    <title>Anotador Truco</title>
    <meta name="description" content="Anotador de truco online simple, rápido y gratis. Contador de puntos para el truco argentino con soporte para 15 o 30 puntos.">
    <meta name="keywords" content="truco contador de puntos, anotador de truco online, contador truco argentina, puntos de truco, truco argentino">
    <meta name="author" content="Anotador Truco">
    
    <link rel="stylesheet" href="styles.css">
    
    <!-- fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Metamorphous&family=Modern+Antiqua&display=swap" rel="stylesheet">
</head>
<body>
    <!-- svg -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="icon-sun" viewBox="0 0 24 24">
            <path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z"/>
        </symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24">
            <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd"/>
        </symbol>
        <symbol id="icon-sync" viewBox="0 0 24 24">
            <path d="M3.38 8A9.502 9.502 0 0 1 12 2.5a9.502 9.502 0 0 1 9.215 7.182.75.75 0 1 0 1.456-.364C21.473 4.539 17.15 1 12 1a10.995 10.995 0 0 0-9.5 5.452V4.75a.75.75 0 0 0-1.5 0V8.5a1 1 0 0 0 1 1h3.75a.75.75 0 0 0 0-1.5H3.38Zm-.595 6.318a.75.75 0 0 0-1.455.364C2.527 19.461 6.85 23 12 23c4.052 0 7.592-2.191 9.5-5.451v1.701a.75.75 0 0 0 1.5 0V15.5a1 1 0 0 0-1-1h-3.75a.75.75 0 0 0 0 1.5h2.37A9.502 9.502 0 0 1 12 21.5c-4.446 0-8.181-3.055-9.215-7.182Z"/>
        </symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24">
            <path d="M11.75 4.5a.75.75 0 0 1 .75.75V11h5.75a.75.75 0 0 1 0 1.5H12.5v5.75a.75.75 0 0 1-1.5 0V12.5H5.25a.75.75 0 0 1 0-1.5H11V5.25a.75.75 0 0 1 .75-.75Z"/>
        </symbol>
        <symbol id="icon-minus" viewBox="0 0 24 24">
            <path d="M4.5 12.75a.75.75 0 0 1 .75-.75h13.5a.75.75 0 0 1 0 1.5H5.25a.75.75 0 0 1-.75-.75Z"/>
        </symbol>
    </svg>

    <div class="app-container">
        <header class="app-header">
            <div class="header-title">
                <h1>Anotador</h1>
                <span class="subtitle">TRUCO</span>
            </div>
            <div class="header-actions">
                <select id="game-mode-select" class="mode-select" aria-label="Modo de juego">
                    <option value="30">A 30 Puntos</option>
                    <option value="15">A 15 Puntos</option>
                </select>
                <div class="header-divider"></div>
                <button id="btn-theme-toggle" class="btn-icon" aria-label="Cambiar tema" title="Cambiar tema">
                    <svg class="icon theme-icon" aria-hidden="true"><use id="theme-icon-use" href="#icon-moon"></use></svg>
                </button>
                <div class="header-divider"></div>
                <button id="btn-reset-header" class="btn-icon" aria-label="Reiniciar juego" title="Reiniciar juego">
                    <svg class="icon" aria-hidden="true"><use href="#icon-sync"></use></svg>
                </button>
            </div>
        </header>
        
        <main class="score-board">
            <!-- equipo nosotros -->
            <section class="team-section" id="team-nosotros" data-team="nosotros">
                <div class="team-header">
                    <h2>Nosotros</h2>
                    <span class="score-number" id="score-num-nosotros">0</span>
                </div>
                
                <div class="casitas-container" id="casitas-nosotros">
                    <!-- las casitas se inyectarán aquí por js verticalmente -->
                </div>
                
                <div class="controls">
                    <button class="btn-control btn-minus" data-action="minus" aria-label="Restar punto Nosotros">
                        <svg class="icon" aria-hidden="true"><use href="#icon-minus"></use></svg>
                    </button>
                    <button class="btn-control btn-plus" data-action="plus" aria-label="Sumar punto Nosotros">
                        <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
                    </button>
                </div>
                
                <!--<div class="instruction-pill">
                    <span>• TOQUE +1</span>
                    <span>• MANTENER -1</span>
                </div>-->
                
                <div class="touch-overlay"></div>
            </section>

            <div class="divider"></div>

            <!-- equipo ellos -->
            <section class="team-section" id="team-ellos" data-team="ellos">
                <div class="team-header">
                    <h2>Ellos</h2>
                    <span class="score-number" id="score-num-ellos">0</span>
                </div>
                
                <div class="casitas-container" id="casitas-ellos">
                    <!-- las casitas se inyectarán aquí por js verticalmente -->
                </div>
                
                <div class="controls">
                    <button class="btn-control btn-minus" data-action="minus" aria-label="Restar punto Ellos">
                        <svg class="icon" aria-hidden="true"><use href="#icon-minus"></use></svg>
                    </button>
                    <button class="btn-control btn-plus" data-action="plus" aria-label="Sumar punto Ellos">
                        <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
                    </button>
                </div>
                
                <!--<div class="instruction-pill">
                    <span>• TOQUE +1</span>
                    <span>• MANTENER -1</span>
                </div>-->
                
                <div class="touch-overlay"></div>
            </section>
        </main>
    </div>

    <!-- modal de ganador -->
    <div id="winner-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="winner-title">¡Ganador!</h2>
            <p id="winner-message">El equipo ha ganado.</p>
            <div class="modal-actions">
                <button id="btn-close-modal" class="btn btn-secondary">Cerrar</button>
                <button id="btn-new-game" class="btn btn-primary">Nuevo Juego</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

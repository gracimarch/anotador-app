<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#E8D8C4">
    <meta name="google-site-verification" content="U9oVC4BbGgtnGcmuOPqHGOhu8wN2IxCF4zDaKpDwzY4" />

    <!-- seo -->
    <title>Anotador Truco</title>
    <meta name="description" content="Anotador de truco online simple, rápido y gratis. Contador de puntos para el truco argentino con soporte para 15 o 30 puntos.">
    <meta name="keywords" content="truco contador de puntos, anotador de truco online, contador truco argentina, puntos de truco, truco argentino">
    <meta name="author" content="Anotador Truco">
    <link rel="canonical" href="https://anotador-app.vercel.app/">

    <!-- favicons & manifest -->
    <link rel="icon" href="anotador-favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="manifest" href="manifest.json">

    <!-- open graph -->
    <meta property="og:title" content="Anotador Truco">
    <meta property="og:description" content="Anotador de truco online simple, rápido y gratis. Contador de puntos para el truco argentino.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://anotador-app.vercel.app/">
    <meta property="og:image" content="icons/icon-512x512.png">

    <!-- twitter card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Anotador Truco">
    <meta name="twitter:description" content="Anotador de truco online simple, rápido y gratis.">
    <meta name="twitter:image" content="icons/icon-512x512.png">

    <!-- schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Anotador Truco",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "description": "Anotador de truco online simple y rápido para el truco argentino.",
      "url": "https://anotador-app.vercel.app/"
    }
    </script>

    <!-- fuentes y estilos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Metamorphous&family=Modern+Antiqua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

        </symbol>
        <symbol id="icon-sync" viewBox="0 0 16 16">

        </symbol>
        <symbol id="icon-menu" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" d="M4 6h16M4 12h16M4 18h16"/>
        </symbol>
        <symbol id="icon-close" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" d="M18 6L6 18M6 6l12 12"/>
        </symbol>
        <symbol id="icon-user-plus" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M16 11c1.657 0 3-1.343 3-3s-1.343-3-3-3m3 14v-1a4 4 0 0 0-3-3.874M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 9v-1a7 7 0 0 1 14 0v1M19 8v6m-3-3h6"/>

    </svg>

    <div class="app-container">
        <header class="app-header">
            <div class="header-title">
                <h1>Anotador</h1>
                <p id="header-mode-label" class="header-mode-label"></p>
            </div>
            <div class="header-actions">
                <button id="btn-install" class="btn-icon" aria-label="Instalar App" title="Instalar App" style="display:none;">
                    <svg class="icon" aria-hidden="true"><use href="#icon-download"></use></svg>
                </button>
                <button id="btn-theme-toggle" class="btn-icon" aria-label="Cambiar tema" title="Cambiar tema">
                    <svg class="icon theme-icon" aria-hidden="true"><use id="theme-icon-use" href="#icon-moon"></use></svg>
                </button>
                <button id="btn-update" class="btn-icon" aria-label="Buscar actualización" title="Buscar actualización">
                    <svg class="icon" aria-hidden="true"><use href="#icon-sync"></use></svg>
                </button>
                <button id="btn-reset" class="btn-icon" aria-label="Reiniciar juego" title="Reiniciar juego">
                    <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
                </button>
                <button id="btn-menu" class="btn-icon" aria-label="Seleccionar modo" title="Seleccionar modo" aria-expanded="false">
                    <svg class="icon" aria-hidden="true"><use href="#icon-menu"></use></svg>
                </button>
            </div>
        </header>

        <!-- score board: dynamically populated by JS -->
        <main class="score-board layout-two-col" id="score-board"></main>

        <footer class="app-footer">
            <select id="select-maxscore" class="mode-select" aria-label="Puntos máximos"></select>
        </footer>
    </div>

    <!-- mode side panel -->
    <div id="mode-panel" class="mode-panel" role="dialog" aria-label="Seleccionar modo" aria-hidden="true">
        <div class="mode-panel-header">
            <p class="mode-panel-title">Anotadores</p>
            <button id="btn-close-panel" class="btn-icon btn-close-panel" aria-label="Cerrar menú">
                <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
            </button>
        </div>
        <div id="mode-panel-list" class="mode-panel-list"></div>
    </div>
    <!-- backdrop -->
    <div id="mode-backdrop" class="mode-backdrop"></div>

    <!-- modal de ganador -->
    <div id="winner-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="winner-title">¡Ganador!</h2>
            <p id="winner-message">El equipo ha ganado.</p>
            <div class="modal-actions">
                <button id="btn-close-modal" class="btn btn-secondary">Cerrar</button>
                <button id="btn-new-game" class="btn btn-primary">Nuevo Juego</button>
            </div>
        </div>
    </div>

    <!-- modal de confirmación -->
    <div id="confirm-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="confirm-title">¿Estás seguro?</h2>
            <p id="confirm-message">Esta acción no se puede deshacer.</p>
            <div class="modal-actions">
                <button id="btn-cancel-confirm" class="btn btn-secondary">Cancelar</button>
                <button id="btn-accept-confirm" class="btn btn-primary">Aceptar</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
